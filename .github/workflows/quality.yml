name: Bahar quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bahar-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./db/ci.db
      SESSION_SECRET: ci-only-not-a-production-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bunx eslint .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build Next.js
        run: bunx next build

      - name: Prepare Prisma Worker exports
        run: node scripts/patch-prisma-client-exports.mjs

      - name: Build Cloudflare Worker bundle
        run: bunx opennextjs-cloudflare build --skipNextBuild

      - name: Audit Bahar UI conventions
        run: node scripts/bahar-design-check.mjs

      - name: Verify Bahar design-system integrity
        run: node scripts/bahar-design-system-check.mjs

      - name: Deploy production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2d8ecd559d50face3d08dfa151e9376c"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Cloudflare deployment skipped: CLOUDFLARE_API_TOKEN secret is not configured."
            exit 0
          fi
          bunx wrangler deploy
